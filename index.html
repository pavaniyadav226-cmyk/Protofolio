<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pavani Yadav | Interactive Task Manager</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Header -->
    <header class="site-header">
        <div class="container nav-container">
            <a href="#home" class="logo">Pavani<span>.dev</span></a>
            <button id="theme-toggle" aria-label="Toggle theme">🌓</button>
        </div>
    </header>

    <main class="container main-content">
        <section class="todo-section">
            <h1 class="section-title">Task Management App</h1>
            
            <!-- Task Input Form -->
            <form id="todo-form" class="todo-form">
                <input type="text" id="todo-input" placeholder="What needs to be done?" required autocomplete="off">
                <button type="submit" class="btn btn-primary">Add Task</button>
            </form>

            <!-- Filter Controls -->
            <div class="filter-buttons">
                <button class="filter-btn active" data-filter="all">All</button>
                <button class="filter-btn" data-filter="active">Active</button>
                <button class="filter-btn" data-filter="completed">Completed</button>
            </div>

            <!-- Dynamic Task List Container -->
            <ul id="todo-list" class="todo-list">
                <!-- Tasks will be dynamically rendered here -->
            </ul>

            <!-- Task Counter & Clear Completed -->
            <div class="todo-footer">
                <span id="task-count">0 items left</span>
                <button id="clear-completed" class="btn-text">Clear Completed</button>
            </div>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
