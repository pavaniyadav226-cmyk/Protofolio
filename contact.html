<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Get in touch with Pavani Yadav, B.Tech CSE student at MLRITM, for internship and web development opportunities.">
    <title>Pavani Yadav | Contact</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --accent-color: #38bdf8;
            --accent-hover: #0ea5e9;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg-color); color: var(--text-color); line-height: 1.6; }
        
        header { background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(10px); position: sticky; top: 0; border-bottom: 1px solid #334155; z-index: 1000; }
        nav { max-width: 1000px; margin: auto; display: flex; justify-content: space-between; align-items: center; padding: 1.2rem 2rem; }
        .logo { font-weight: bold; font-size: 1.2rem; color: var(--accent-color); text-decoration: none; }
        nav ul { list-style: none; display: flex; gap: 2rem; }
        nav ul li a { color: var(--text-muted); text-decoration: none; font-weight: 500; transition: color 0.3s ease; }
        nav ul li a:hover, nav ul li a:focus, nav ul li a[aria-current="page"] { color: var(--accent-color); }

        main { max-width: 1000px; margin: 3rem auto; padding: 0 2rem; }
        
        .contact-container { background-color: var(--card-bg); border: 1px solid #334155; padding: 2.5rem; border-radius: 12px; max-width: 600px; margin: auto; }
        .contact-container h1 { font-size: 2.2rem; margin-bottom: 0.5rem; color: var(--text-color); }
        .contact-container p { color: var(--text-muted); margin-bottom: 2rem; }
        
        form { display: flex; flex-direction: column; gap: 1.2rem; }
        label { font-weight: 600; font-size: 0.95rem; color: var(--text-color); }
        input, textarea { background-color: #0f172a; border: 1px solid #334155; color: var(--text-color); padding: 0.75rem; font-size: 1rem; border-radius: 6px; outline: none; transition: border-color 0.3s ease; }
        input:focus, textarea:focus { border-color: var(--accent-color); }
        
        button { background-color: var(--accent-color); color: #0f172a; padding: 0.75rem; border: none; border-radius: 6px; font-size: 1rem; font-weight: bold; cursor: pointer; transition: background-color 0.3s ease, transform 0.2s ease; margin-top: 0.5rem; }
        button:hover, button:focus { background-color: var(--accent-hover); transform: translateY(-2px); }

        footer { text-align: center; padding: 2rem; color: var(--text-muted); border-top: 1px solid #334155; margin-top: 4rem; font-size: 0.9rem; }
    </style>
</head>
<body>
    <header>
        <nav aria-label="Main Navigation">
            <a href="index.html" class="logo">Pavani Yadav</a>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="contact.html" aria-current="page">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="contact-container">
            <h1>Let's Connect</h1>
            <p>Have an opportunity or want to collaborate? Fill out the form below!</p>
            
            <form action="#" method="POST">
                <div>
                    <label for="name">Your Name</label>
                    <input type="text" id="name" name="name" required aria-required="true" placeholder="Enter your name">
                </div>

                <div>
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" required aria-required="true" placeholder="name@example.com">
                </div>

                <div>
                    <label for="message">Your Message</label>
                    <textarea id="message" name="message" rows="5" required aria-required="true" placeholder="Type your message here..."></textarea>
                </div>

                <button type="submit">Send Message</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Pavani Yadav. All rights reserved.</p>
    </footer>
</body>
</html>
